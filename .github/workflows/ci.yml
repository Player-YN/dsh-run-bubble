name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build on macOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check daemon.mjs
          node --check interop/dsh-chat.mjs

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Compile AppKit overlay
        run: swiftc -O -parse-as-library -framework AppKit overlay.swift -o RunBubbleOverlay

